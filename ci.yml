name: CI · AI Cenzor Studio
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Syntax and import check
        run: |
          python -m compileall -q app.py cenzor tests
          python -c "import streamlit, pandas, faster_whisper; print('Imports OK')"
      - name: Unit and FFmpeg integration tests
        run: python -m unittest discover -s tests -v
